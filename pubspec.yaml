name: pashapon
description: "AI-powered quick receipt scanner and sharing app for family budgeting."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  image: ^4.2.0
  http: ^1.2.1
  share_plus: ^9.0.0
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true